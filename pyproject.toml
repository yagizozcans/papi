[project]
name = "papi"
version = "0.1.0"
description = "Personal, local BIST/KAP disclosure-intelligence tool"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "pydantic>=2.6",
    "typer>=0.12",
    "rich>=13",
    "httpx>=0.27",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "sse-starlette>=2.0",
    "keyring>=25",
    "jsonschema>=4.21",
    "pyyaml>=6",
    "beautifulsoup4>=4.12",
    "lxml>=5",
    "pdfplumber>=0.11",
    "pypdf>=4",
    "openpyxl>=3.1",
    "xlrd>=2",
    "tzdata>=2024.1",
]

[project.scripts]
papi = "papi.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "respx>=0.21",
    "ruff>=0.5",
    "time-machine>=2.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/papi"]

# Non-Python resources needed when installed outside the repo (e.g. `uv tool install .`);
# papi.core.config.resource_dir() prefers the repo copies and falls back to these.
[tool.hatch.build.targets.wheel.force-include]
"alembic" = "papi/_resources/alembic"
"packs" = "papi/_resources/packs"
"contracts" = "papi/_resources/contracts"

[tool.ruff]
line-length = 110
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*.py" = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-ra"
