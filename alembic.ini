# Alembic config for papi. The database URL is derived from $PAPI_HOME (papi.core.config) unless
# `sqlalchemy.url` is set by the caller (papi.core.db.alembic_config does this).
# Usage: `uv run papi db migrate` (preferred) or `uv run alembic upgrade head`.

[alembic]
script_location = %(here)s/alembic
prepend_sys_path = src
file_template = %%(rev)s_%%(slug)s
path_separator = os

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = WARNING
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
