  capital.increase.rights: "bedelli sermaye artırımı yeni pay alma hakları kullanılması izahname"
  distribution.dividend.cash: "kâr payı dağıtımı kâr dağıtım tablosu yönetim kurulu önerisi kâr dağıtım politikası"
  distribution.dividend.stock: "kâr payının pay şeklinde dağıtılması bedelsiz kâr dağıtım tablosu"
  buyback.program.start: "geri alım programı genel kurul yetkilendirme geri alınan paylar"
  buyback.execution: "geri alım işlemi seans başlamadan özel durum açıklaması geri alınan paylar nominal tutar"
  ownership.insider_trade: "idari sorumluluğu bulunan kişiler yakından ilişkili ana ortak paylar işlemler kamuya açıklanır"
  ownership.threshold_crossing: "sermayesindeki payının toplam oy haklarının ulaşması altına düşmesi birlikte hareket"
