# KB full-text search vocabulary — Türkiye pack (PRD 03 §5; used by papi.kb.query / papi.kb.search).
#
# stopwords   tokens ignored in queries: Turkish function words and legal/KAP filler that carries no
#             topic ("ilişkin", "dair", "hakkında", "bildirim" titles…). Written as normal Turkish;
#             they are normalised (lowercase, diacritics folded) on load.
# synonyms    query word → extra words a provision may use instead. KAP subjects speak of
#             "bildirim", "alım satım", "dönük"; the texts say "açıklama", "işlem", "yönelik".
#             Keys/values are stemmed like queries, so inflected forms match too.
# event_terms taxonomy code → wording of the provisions behind it (drafted from the provision texts
#             cited in obligations.yaml); `papi.kb.search_for_event` searches subject + these terms.
version: 1

stopwords:
  [ve, veya, ile, ya, da, de, ki, mi, mu, bu, şu, o, bir, her, gibi, için, ait, olan, olarak, olup,
   ilişkin, ilişkindir, dair, hakkında, hk, hk., göre, kapsamında, üzere, ise, ancak, hem, daha, en,
   kadar, sonra, önce, üzerinde, tarafından, nedeniyle, dolayı, sayılı, inci, ıncı, nci, ncı, üncü,
   uncu, ncü, ncu, madde, maddesi, fıkra, fıkrası, bent, bendi, açıklaması, duyuru, duyurusu, genel,
   diğer, yapılan, yapılması, yapılacak]

synonyms:
  bildirim: [açıklama]
  bildirimi: [açıklama]
  alım: [işlem]
  satım: [işlem]
  dönük: [yönelik]
  beklenti: [geleceğe yönelik değerlendirme]
  kapatma: [durdur]
  kapatılması: [durdurul]
  açma: [başlatma]
  temettü: [kâr payı]
  bedelsiz: [iç kaynak]
  bedelli: [nakit]
  rüçhan: [yeni pay alma]
  birleşme: [devralma]
  devralma: [birleşme]
  satın: [iktisap]
  hisse: [pay]
  ihale: [sözleşme]
  sözleşme: [iş ilişkisi]
  tedbir: [durdur]

event_terms:
