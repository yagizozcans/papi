# papi legal corpus manifest — Türkiye pack (PRD 03 §2).
#
# One entry per document. Adding a document = adding an entry; no code change.
#   id               stable manifest id (also the kv_state / regulation.extra key)
#   official_code    code as printed in the text (II-15.1, 6362, …); guidelines/exchange rules use a slug
#   title            official Turkish title
#   authority        SPK | TBMM | KAP (MKK) | BIST
#   kind             law | communique | guideline | directive | exchange_rule
#   source_urls      official URLs, preferred first (fallbacks are tried in order on failure)
#   priority         P0 | P1 | P2
#   refresh          how often to re-check: daily | weekly | monthly | quarterly | <n>d
#   citation_prefix  stable prefix of citation ids (03 §3.1); never change once published
#   shape            articles (KISIM/BÖLÜM/MADDE/fıkra/bent) | sections (I., 1., 1.1. …)
#   history          optional original/older texts: url + the date that text took effect
#
# URLs verified live on 2026-10-28. mevzuat.spk.gov.tr/api/<Mevzuat|Rehber>/File/<id> is the PDF
# behind SPK's "Mevzuat Sistemi" viewer (mevzuat.spk.gov.tr/<Mevzuat|Rehber>/Dosya/<id>); ids come
# from https://mevzuat.spk.gov.tr/api/Search/All. These PDFs are SPK's consolidated texts and carry
# the "Tebliğ değişikliklerine ilişkin liste" header and inline (Değişik/Ek/Mülga:RG-…) markers.
#
# II-23.1 (Önemli Nitelikteki İşlemlere İlişkin Ortak Esaslar ve Ayrılma Hakkı Tebliği) is repealed
# ("Mülga" in SPK's system, mevzuat.spk.gov.tr/Mevzuat/Dosya/203); its successor II-23.3 is listed.
