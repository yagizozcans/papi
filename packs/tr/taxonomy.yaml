# papi event taxonomy — Türkiye pack (PRD 06 §5.1, 04 §3/§7).
#
# Codes are hierarchical, dot-separated, English and stable. Adding codes is non-breaking; renaming or
# removing one is breaking and bumps `taxonomy_version`.
#
# families.<f>.prior   rules-materiality prior (0–100) for every code of the family (README in
#                      src/papi/triage explains the formula)
# codes.<c>.prior      optional per-code override of the family prior
# codes.<c>.recurring  true → routine/periodic item: no novelty boost (first-of-family-in-365-days)
# codes.<c>.schema     payload JSON Schema name in contracts/schemas/<schema>.json (null → none yet)
version: 1
taxonomy_version: "tr-2026.10"

families:
  capital:      {label_tr: Sermaye,            label_en: Capital,             prior: 60}
  distribution: {label_tr: Kâr dağıtımı,       label_en: Distribution,        prior: 55}
  buyback:      {label_tr: Pay geri alımı,     label_en: Buyback,             prior: 40}
  ownership:    {label_tr: Ortaklık yapısı,    label_en: Ownership,           prior: 45}
  business:     {label_tr: Faaliyet,           label_en: Business,            prior: 50}
  mna:          {label_tr: Birleşme ve satın alma, label_en: M&A,             prior: 60}
  finance:      {label_tr: Finansman,          label_en: Finance,             prior: 35}
  report:       {label_tr: Raporlama,          label_en: Reporting,           prior: 30}
  governance:   {label_tr: Yönetişim,          label_en: Governance,          prior: 25}
  legal:        {label_tr: Hukuki,             label_en: Legal,               prior: 45}
  market:       {label_tr: Piyasa,             label_en: Market,              prior: 35}
  macro:        {label_tr: Makro,              label_en: Macro,               prior: 50}
  other:        {label_tr: Diğer,              label_en: Other,               prior: 20}

